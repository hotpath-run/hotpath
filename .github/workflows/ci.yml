name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The engine must behave the same on all three systems: it starts other
    # programs (MCP servers, agents), edits agent configs in per-OS locations
    # and writes files that are read back on other machines.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22 is the minimum ("engines" in package.json); lts/* is the current LTS
        node: [22, "lts/*"]
    runs-on: ${{ matrix.os }}
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    steps:
      # Actions are pinned to full commit SHAs (the comment is the tag they point
      # at); Dependabot keeps them up to date.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No API keys here: tests mock the LLM, and `pnpm bench` is not run in CI.
      - run: pnpm -r build
      # Every package runs even if one fails, and each failing test becomes an
      # annotation: readable on the run page without opening the logs.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm -r --no-bail test -- --reporter=default --reporter=github-actions 2>&1 | tee test-output.log

      # A crash outside a test (a file that does not load, a failing setup) has no
      # test to annotate: put its lines on the run page too, readable without the logs.
      - name: Show test failures
        if: failure()
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' test-output.log \
            | grep -E "FAIL|Error|error|×|Unhandled|ELIFECYCLE|Timed out|timed out" \
            | grep -v -E "^::|\[recorder\]|✓|stdout \|" | head -40 \
            | while IFS= read -r line; do echo "::error title=test output::${line}"; done
      - run: pnpm lint
